name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  # Builds everywhere and runs the tests that need no server: parsing, the
  # fake TDS server (TLS, Entra, routing), and LocalDB where it is installed.
  build:
    name: Build and unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build -c Release
      - name: Test
        run: dotnet test -c Release --no-build --logger "console;verbosity=normal"

  # The full suite on Linux against SQL Server 2025 in a container, with SQL
  # authentication. The password is a throwaway for a container that only this
  # job can reach.
  sqlserver-linux:
    name: Integration tests (Linux, SQL Server 2025)
    runs-on: ubuntu-latest
    env:
      SA_PASSWORD: Clast-CI-Only-1!
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Clast-CI-Only-1!
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build -c Release
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 90); do
            if docker logs "${{ job.services.mssql.id }}" 2>&1 | grep -q "ready for client connections"; then
              echo "SQL Server is ready"; exit 0
            fi
            sleep 2
          done
          docker logs "${{ job.services.mssql.id }}"
          exit 1
      - name: Write test configuration
        run: |
          cat > "$RUNNER_TEMP/mssqlconfig.json" <<EOF
          {
            "options": {
              "adbc.mssql.server": "localhost",
              "adbc.mssql.database": "master",
              "username": "sa",
              "password": "$SA_PASSWORD",
              "adbc.mssql.trust_server_certificate": "true"
            },
            "supportsStrictEncryption": false,
            "serverCertificateTrusted": false,
            "sqlClientConnectionString": "Server=tcp:localhost;Database=master;User ID=sa;Password=$SA_PASSWORD;TrustServerCertificate=true"
          }
          EOF
      - name: Test
        env:
          MSSQL_TEST_CONFIG_FILE: ${{ runner.temp }}/mssqlconfig.json
        run: dotnet test -c Release --no-build --logger "console;verbosity=normal"
